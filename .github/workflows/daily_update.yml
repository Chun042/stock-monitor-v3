name: TSMC Daily Monitor

on:
  schedule:
    # 13:15 UTC = 21:15 Asia/Taipei (Monday-Friday).
    # GitHub scheduled workflows use UTC here; this avoids a timezone ambiguity.
    - cron: "15 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tsmc-daily-monitor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run cloud monitor
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CLAIMS_SUB: ${{ secrets.VAPID_CLAIMS_SUB }}
          PUSH_API_BASE: ${{ secrets.PUSH_API_BASE }}
          PUSH_ADMIN_TOKEN: ${{ secrets.PUSH_ADMIN_TOKEN }}
        run: |
          python update_tsmc_tracker.py --mode cloud
          python update_multi_stock.py

      - name: Commit updated cloud data
        run: |
          git config user.name "tsmc-stock-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add docs/latest.json docs/stocks.json data/ output/
          git diff --cached --quiet || git commit -m "Daily TSMC stock update"
          git push
